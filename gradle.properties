# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=io.github.s_armaan.transparentplayer
java_version=25

# Common
minecraft_version=26.3
mod_name=Transparent Player
mod_author=Armaan Saini
mod_id=transparentplayer
license=MIT
credits=
description=Renders your own player model translucent, with a configurable opacity and a toggle keybind.
# Range used in neoforge.mods.toml. This branch targets 26.3 only; 26.2 has its own branch.
minecraft_version_range=[26.3, 26.4)
# Range used in fabric.mod.json
fabric_minecraft_range=>=26.3 <26.4
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.163.0+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.90
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
